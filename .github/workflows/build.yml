name: Build

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  webui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Build
        working-directory: webui
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error

  firmware:
    name: Firmware (ESP32, ESP-IDF v5.3.2)
    needs: webui
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: webui/dist

      - name: Select ESP32 board configuration
        run: cp boards/esp32-idf/sdkconfig boards/esp32-idf/sdkconfig.defaults .

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py size

      - name: Package
        shell: bash
        run: |
          chmod +x boards/esp32-idf/buildzipdir.sh
          boards/esp32-idf/buildzipdir.sh

      - uses: actions/upload-artifact@v7
        with:
          name: esp32-binaries
          path: release/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: esp32-binaries
          path: release

      - uses: ncipollo/release-action@v1
        with:
          artifacts: release/*.zip
          bodyFile: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-flash-tool:
    name: Publish to WebFlashTool
    if: github.ref_type == 'tag'
    needs: firmware
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT with "Contents: read and write" on airmeter-io/WebFlashTool.
      # The flash tool serves release zips from its own public/ folder.
      WFT_TOKEN: ${{ secrets.WEBFLASHTOOL_TOKEN }}
    steps:
      - name: Token check
        if: env.WFT_TOKEN == ''
        run: echo "::warning::WEBFLASHTOOL_TOKEN secret is not set, skipping publish to WebFlashTool"

      - uses: actions/checkout@v7
        if: env.WFT_TOKEN != ''
        with:
          repository: airmeter-io/WebFlashTool
          token: ${{ env.WFT_TOKEN }}
          path: WebFlashTool
          persist-credentials: true

      - uses: actions/download-artifact@v8
        if: env.WFT_TOKEN != ''
        with:
          name: esp32-binaries
          path: WebFlashTool/public

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: env.WFT_TOKEN != ''
        with:
          repository: WebFlashTool
          commit_message: Add firmware release ${{ github.ref_name }}
